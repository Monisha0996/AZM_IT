{% extends 'base.html' %}{% block title %}System User{% endblock %}{% block content %}<div class="top"><div><h1>{{'Edit System User' if item else 'Add System User'}}</h1><p class="sub">Configure login access to AccessHub, separate from each employee's application permissions.</p></div><a class="btn secondary" href="{{url_for('users')}}">Back</a></div><form method="post" class="panel form-panel"><input type="hidden" name="_csrf" value="{{csrf_token}}"><div class="fields"><div class="field"><label>Username *</label><input name="username" minlength="3" required value="{{item.username if item else ''}}"></div><div class="field"><label>System role *</label><select name="role">{% for v in roles %}<option {{'selected' if item and item.role==v else ''}}>{{v}}</option>{% endfor %}</select></div><div class="field"><label>{{'New password (leave blank to keep existing)' if item else 'Password (12+ characters)'}}</label><input type="password" name="password" minlength="12" {% if not item %}required{% endif %} autocomplete="new-password"></div><div class="field"><label>Login status</label><select name="enabled"><option value="1" {{'selected' if not item or item.enabled else ''}}>Enabled</option><option value="0" {{'selected' if item and not item.enabled else ''}}>Disabled</option></select></div></div><div class="form-actions"><button class="btn">Save User</button><a class="btn secondary" href="{{url_for('users')}}">Cancel</a></div></form>{% endblock %}
